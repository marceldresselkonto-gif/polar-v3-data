name: Polar daily export

on:
  push:
    paths:
      - ".polar-trigger"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date YYYY-MM-DD; blank = refresh previous 3 completed days"
        required: false
        type: string
  schedule:
    - cron: "30 8 * * *"
      timezone: "Europe/Berlin"
    - cron: "30 11 * * *"
      timezone: "Europe/Berlin"
    - cron: "30 14 * * *"
      timezone: "Europe/Berlin"
    - cron: "30 17 * * *"
      timezone: "Europe/Berlin"

concurrency:
  group: polar-daily-export
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Polar data
        env:
          POLAR_CLIENT_ID: ${{ secrets.POLAR_CLIENT_ID }}
          POLAR_CLIENT_SECRET: ${{ secrets.POLAR_CLIENT_SECRET }}
          POLAR_REFRESH_TOKEN: ${{ secrets.POLAR_REFRESH_TOKEN }}
          POLAR_DATE: ${{ inputs.date }}
        run: python src/fetch_polar.py

      - name: Validate export files
        env:
          POLAR_DATE: ${{ inputs.date }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Berlin")
          requested = os.getenv("POLAR_DATE", "").strip()
          if requested:
              expected = [requested]
          else:
              today = datetime.now(tz).date()
              expected = [
                  (today - timedelta(days=3)).isoformat(),
                  (today - timedelta(days=2)).isoformat(),
                  (today - timedelta(days=1)).isoformat(),
              ]

          for day in expected:
              for name in ("raw.json", "summary.json"):
                  p = Path("data") / day / name
                  if not p.exists():
                      raise SystemExit(f"ERROR: expected export missing: {p}")
                  with p.open(encoding="utf-8") as fh:
                      payload = json.load(fh)
                  if payload.get("date") != day:
                      raise SystemExit(f"ERROR: date mismatch in {p}: {payload.get('date')} != {day}")

          latest = json.loads(Path("polar-v3-latest.json").read_text(encoding="utf-8"))
          latest_expected = expected[-1]
          if latest.get("date") != latest_expected:
              raise SystemExit(
                  f"ERROR: polar-v3-latest.json points to {latest.get('date')}, expected {latest_expected}"
              )

          status = latest.get("data_status", {})
          print(f"Latest day {latest_expected}: {status.get('status', 'unknown')}")
          if status.get("status") == "provisional":
              print("WARNING: Polar cloud is not complete yet; a later scheduled run will backfill this day.")
          PY

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/ state/ polar-v3-latest.json 2>/dev/null && [ -z "$(git status --porcelain data/ state/ polar-v3-latest.json 2>/dev/null)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "polar-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ state/ polar-v3-latest.json
          git commit -m "Update Polar data $(date -u +%F)"
          git push
